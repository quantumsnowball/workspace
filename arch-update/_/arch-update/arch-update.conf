#
# -- arch-update timeout fix --
#
# related source code:
# 1. /usr/share/arch-update/lib/config.sh, line 47
#   update_check_timeout=$(grep -E '^[[:space:]]*UpdateCheckTimeout[[:space:]]*=[[:space:]]*[0-9][0-9]*[[:space:]]*$' "${config_file}" 2> /dev/null | awk -F '=' '{print $2}' | tr -d '[:space:]')
# 2. /usr/share/arch-update/lib/list_packages.sh, line 12
#   packages=$(CHECKUPDATES_DB="${checkupdates_db_tmpdir}" timeout "${update_check_timeout}" checkupdates --nocolor)
# 3. /usr/bin/checkupdates, line 150
#   if ! fakeroot -- pacman -Sy --disable-sandbox-filesystem --dbpath "$CHECKUPDATES_DB" --logfile /dev/null &> /dev/null; then
#   	die 'Cannot fetch updates'
#   fi
#
# the bug exist because the checkupdates runs too slowly and caused timeout,
# mainly because the extra repo is fetch very slowly, you can reproduce the slow fetching by running
# `mkdir /tmp/test-db && fakeroot -- pacman -Sy --disable-sandbox-filesystem --dbpath /tmp/test-db --logfile /dev/null && rm -rf /tmp/test-db`
#
# by increasing the timeout to 60, usually will fix the problem, if still timeout, then test again
# run the command above to spot which repo is causing slow download
#
# root cause:
# in /etc/pacman.d/mirrorlist, at the top of the file there are two slow dangling repo,
#   Server = https://mirror.zyner.org/archlinux/$repo/os/$arch
#   Server = https://archlinux.cachyos.org/repo/$repo/os/$arch
# in /etc/pacman.conf, we found that
#   [extra]
#   Include = /etc/pacman.d/mirrorlist
# that means these two server is exactly causing the extra repo to be slow
# why rate-mirrors won't fix it? because these two lines is prepended at the top! I don't know who did this
# they cannot be overwritten by rate-mirrors or cachyos-rate-mirrors because they append to the file
# manually deleted these two lines and the update becomes very fast instantly!
UpdateCheckTimeout = 60
