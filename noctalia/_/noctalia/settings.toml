[bar.default]
position = "bottom"
background_opacity = 0.5
center = [ "launcher", "wallpaper", "workspaces", "tray", "clipboard", "notifications", "volume", "network", "bluetooth" ]
end = [ "media", "brightness", "clock" ]
start = [ "cpu", "temp", "ram", "network_rx", "network_tx" ]
margin_ends = 0
widget_spacing = 10

    [bar.default.dead_zone.actions]
    left = "settings-toggle"
    scroll_down = "workspace-switch next"
    scroll_up = "workspace-switch prev"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 898.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
position = "bottom_center"
position_vertical = "bottom_center"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[widget.workspaces]
anchor = true
display = "none"
scale = 1.2
